# Manual run only: lint and tests. Never on push (the repository owner's cost rule).
name: ci
on:
  workflow_dispatch: {}
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet ruff pytest z3-solver pyyaml
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q
